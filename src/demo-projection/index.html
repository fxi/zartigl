<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zartigl · projections</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <main class="stage" data-ref="stage">
        <canvas class="layer-back" data-ref="back"></canvas>
        <canvas class="layer-gl" data-ref="gl"></canvas>
        <canvas class="layer-front" data-ref="front"></canvas>
        <p class="credits">
          <span data-ref="projectionName"></span>
          // Render: zartigl // Data:
          <span data-ref="provider"></span>
        </p>
        <p class="status" data-ref="status" role="status"></p>
        <div class="map-controls">
          <button
            type="button"
            class="round"
            data-ref="zoomIn"
            aria-label="Zoom in">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path d="M5 12h14M12 5v14" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round"
            data-ref="zoomOut"
            aria-label="Zoom out">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path d="M5 12h14" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round"
            data-ref="rotateLeft"
            aria-label="Rotate left">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path
                  d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round"
            data-ref="rotateRight"
            aria-label="Rotate right">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g class="glyph" transform="translate(12 12)">
                <path
                  d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round compass"
            data-ref="compass"
            aria-pressed="true"
            aria-label="North up, locked">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <g data-ref="needle">
                <text x="24" y="17" text-anchor="middle">N</text>
                <path d="M24 20 31 35 24 31 17 35Z" />
                <circle class="knob" cx="24" cy="3.5" r="2.5" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="round play"
            data-ref="play"
            aria-label="Pause">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path class="icon-play" d="M19 14.5 35 24 19 33.5Z" />
              <path class="icon-pause" d="M17 15h5v18h-5zM26 15h5v18h-5z" />
            </svg>
          </button>
        </div>
      </main>

      <header class="clock">
        <div class="date" data-ref="date"></div>
        <div class="hour" data-ref="hour"></div>
      </header>

      <aside class="rail">
        <section class="cell timeline">
          <div class="track">
            <input
              data-ref="time"
              type="range"
              min="0"
              max="1"
              step="0.001"
              value="0"
              aria-label="Time" />
            <ol class="days" data-ref="days"></ol>
          </div>
        </section>
        <section class="cell controls">
          <select class="picker" data-ref="month" aria-label="Month"></select>
          <select
            class="picker"
            data-ref="speed"
            aria-label="Playback speed"></select>
        </section>
        <section class="cell legend">
          <div class="scale">
            <div class="ramp" data-ref="ramp"></div>
            <ol class="ticks" data-ref="ticks"></ol>
          </div>
          <div class="unit" data-ref="unit"></div>
          <div class="speed-key" data-ref="speedKey" hidden>
            <div class="speed-bar"></div>
            <div class="speed-labels">
              <span>0</span>
              <span data-ref="speedMax"></span>
            </div>
          </div>
        </section>
        <section class="cell controls">
          <select
            class="picker"
            data-ref="palette"
            aria-label="Palette"></select>
        </section>
        <section class="cell actions">
          <button
            type="button"
            class="action"
            data-ref="gradeToggle"
            aria-controls="grade-panel"
            aria-expanded="false"
            title="Color settings"
            aria-label="Color settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" />
            </svg>
          </button>
          <label class="action" title="Projection">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path
                d="M3 12h18M12 3c-5 5.5-5 12.5 0 18M12 3c5 5.5 5 12.5 0 18" />
            </svg>
            <select
              class="picker"
              data-ref="projection"
              aria-label="Projection"></select>
          </label>
          <button
            type="button"
            class="action share"
            data-ref="share"
            title="Copy a link to this view"
            aria-label="Share">
            <svg class="icon icon-share" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 11v9h14v-9" />
            </svg>
            <svg
              class="icon icon-copied"
              viewBox="0 0 24 24"
              aria-hidden="true">
              <path d="m5 12.5 4.5 4.5L19 7.5" />
            </svg>
          </button>
        </section>
        <form
          class="grade"
          id="grade-panel"
          data-ref="gradePanel"
          aria-label="Color settings"
          hidden>
          <label class="grade-switch">
            <input type="checkbox" name="enabled" />
            Enhanced colors
          </label>
          <label>
            Exposure
            <input name="exposure" type="range" min="0" max="4" step="0.05" />
          </label>
          <label>
            Contrast
            <input name="contrast" type="range" min="0" max="1" step="0.01" />
          </label>
          <label>
            Saturation
            <input
              name="saturation"
              type="range"
              min="-1"
              max="1"
              step="0.01" />
          </label>
          <label>
            Highlights
            <input name="highlights" type="range" min="0" max="1" step="0.01" />
          </label>
          <button type="reset" class="grade-reset">Reset</button>
        </form>
      </aside>

      <footer class="bar">
        <label class="field">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 8c3-2.5 6 2.5 9 0s6-2.5 9 0M3 13c3-2.5 6 2.5 9 0s6-2.5 9 0M3 18c3-2.5 6 2.5 9 0s6-2.5 9 0" />
          </svg>
          <select class="picker" data-ref="layer" aria-label="Layer"></select>
        </label>
        <label class="field" title="Particle color" data-ref="tintField">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3.5c3.5 4.2 6 7.6 6 10.5a6 6 0 0 1-12 0c0-2.9 2.5-6.3 6-10.5Z" />
          </svg>
          <select
            class="picker"
            data-ref="tint"
            aria-label="Particle color"></select>
        </label>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
