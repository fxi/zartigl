<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111018" />
    <meta name="description" content="A live-data story built with Zartigl and cloud-native Zarr." />
    <title>Planetary Signal — Zartigl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="story" class="story" aria-live="polite">
      <div id="map" class="map" aria-label="Interactive environmental data map"></div>
      <div class="map-tint" aria-hidden="true"></div>
      <div id="enso-regions" class="map-labels" aria-hidden="true"></div>

      <section class="content">
        <div class="copy">
          <p id="signal" class="signal"></p>
          <h1 id="title"></h1>
          <p id="description" class="description"></p>
          <p id="timestamp" class="timestamp"></p>
        </div>
        <aside id="analysis" class="analysis" hidden>
          <div id="chart" class="chart"></div>
          <footer id="provenance" class="provenance"></footer>
        </aside>
      </section>

      <div id="status" class="status" role="status">Loading map…</div>
      <div class="vertical-mark" aria-hidden="true">ZARTIGL · CLOUD-NATIVE ZARR · PLANETARY SIGNAL</div>
      <nav class="navigation" aria-label="Story navigation">
        <button id="previous" type="button" aria-label="Previous scene">←</button>
        <span id="counter"></span>
        <button id="play" type="button" aria-label="Pause animation">Pause</button>
        <button id="next" type="button" aria-label="Next scene">→</button>
      </nav>
      <div class="progress" aria-hidden="true"><div id="progress"></div></div>
      <div class="grain" aria-hidden="true"></div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
